<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your representatives · Congress Bills</title>
    <link rel="stylesheet" href="styles.css?v=20260728h" />
  </head>
  <body>
    <nav id="app-nav" class="app-nav" aria-label="Main">
      <div class="app-nav__inner">
        <a class="app-nav__brand" href="index.html">Congress Bills</a>
        <div class="app-nav__links">
          <a class="app-nav__link" href="index.html">Home</a>
          <a class="app-nav__link" href="bills.html">Bills</a>
          <a class="app-nav__link" href="bills-policies.html">Feed</a>
          <a class="app-nav__link" href="topics.html">Topics</a>
          <a class="app-nav__link is-active" href="politicians.html"
            >Politicians</a
          >
          <a class="app-nav__link" href="profile.html">Profile</a>
        </div>
        <div class="app-nav__actions" id="app-nav-actions">
          <a class="app-nav__button app-nav__button--ghost" href="auth.html"
            >Sign in</a
          >
          <a
            class="app-nav__button app-nav__button--primary"
            href="auth.html?mode=signup"
            >Sign up</a
          >
        </div>
      </div>
    </nav>

    <main class="page">
      <header class="header">
        <div>
          <p class="eyebrow">
            <a class="text-link" href="politicians.html">← Politicians</a>
          </p>
          <h1>Your representatives</h1>
          <p class="subtitle">
            Results for <strong id="results-query">your address</strong>
          </p>
        </div>
      </header>

      <section class="lookup-panel" aria-labelledby="results-lookup-heading">
        <h2 id="results-lookup-heading">Search another address</h2>
        <form id="address-form" class="keyword-form">
          <input
            id="address-input"
            class="search-bar__input"
            type="search"
            name="address"
            placeholder="Street address or ZIP code"
            autocomplete="street-address"
            required
          />
          <button class="refresh-btn" type="submit">Look up</button>
        </form>
      </section>

      <section
        class="lookup-results-panel"
        aria-labelledby="results-heading"
      >
        <h2 id="results-heading" class="visually-hidden">Search results</h2>
        <p id="address-status" class="status lookup-panel__status" hidden></p>
        <div id="address-results" class="politician-results"></div>
      </section>
    </main>

    <script src="config.js"></script>
    <script src="shared.js"></script>
    <script src="nav.js"></script>
    <script src="politicians-shared.js?v=20260729c"></script>
    <script src="politicians-results.js?v=20260728e" defer></script>
  </body>
</html>
