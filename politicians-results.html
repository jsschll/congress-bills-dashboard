<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your representatives · Article 1</title>
    <script>
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var raw = (
            params.get("address") ||
            params.get("q") ||
            params.get("zipCode") ||
            params.get("zip") ||
            ""
          ).trim();
          var next = "representatives.html";
          if (raw) {
            var key = /^\d{5}(-\d{4})?$/.test(raw) ? "zipCode" : "address";
            var value = key === "zipCode" ? raw.slice(0, 5) : raw;
            next =
              "representatives.html?" +
              key +
              "=" +
              encodeURIComponent(value);
          }
          window.location.replace(next);
        } catch (e) {
          window.location.replace("representatives.html");
        }
      })();
    </script>
  </head>
  <body>
    <p>
      Redirecting to the unified Representative Scorecard…
      <a href="representatives.html">Continue</a>
    </p>
  </body>
</html>
