<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your representatives · Congress Bills</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=20260729g" />
  </head>
  <body>
    <nav id="app-nav" class="app-nav" aria-label="Main"></nav>

    <main class="page">
      <header class="header">
        <div>
          <p class="eyebrow">
            <a class="text-link" href="politicians.html">← Politicians</a>
          </p>
          <h1>Your representatives</h1>
          <p class="subtitle">
            Results for <strong id="results-query">your address</strong>
          </p>
        </div>
      </header>

      <section class="lookup-panel" aria-labelledby="results-lookup-heading">
        <h2 id="results-lookup-heading">Search another address</h2>
        <form id="address-form" class="keyword-form">
          <input
            id="address-input"
            class="search-bar__input"
            type="search"
            name="address"
            placeholder="Street address or ZIP code"
            autocomplete="street-address"
            required
          />
          <button class="refresh-btn" type="submit">Look up</button>
        </form>
      </section>

      <section
        class="lookup-results-panel"
        aria-labelledby="results-heading"
      >
        <h2 id="results-heading" class="visually-hidden">Search results</h2>
        <p id="address-status" class="status lookup-panel__status" hidden></p>
        <div id="address-results" class="politician-results"></div>
      </section>
    </main>

    <script src="config.js"></script>
    <script src="shared.js"></script>
    <script src="nav.js?v=20260729g"></script>
    <script src="politicians-shared.js?v=20260729f"></script>
    <script src="politicians-results.js?v=20260728e" defer></script>
  </body>
</html>
