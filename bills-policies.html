<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feed · Congress Bills</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav id="app-nav" class="app-nav" aria-label="Main"></nav>

    <main class="page page--policy-feed">
      <header class="header">
        <div>
          <p class="eyebrow">Legislation</p>
          <h1>Feed</h1>
          <p class="subtitle">
            All government activity, updates on what you follow, and related
            suggestions you might also care about.
          </p>
        </div>
        <a class="refresh-btn" href="topics.html" id="feed-manage-topics" hidden
          >Manage topics</a
        >
      </header>

      <section class="policy-feed-tabs" aria-label="Feed views">
        <button
          id="tab-all-feed"
          class="policy-feed-tabs__button is-active"
          type="button"
          data-tab="all"
        >
          All News
        </button>
        <button
          id="tab-my-feed"
          class="policy-feed-tabs__button"
          type="button"
          data-tab="mine"
        >
          My Feed
        </button>
        <button
          id="tab-foryou-feed"
          class="policy-feed-tabs__button"
          type="button"
          data-tab="foryou"
        >
          For You
        </button>
      </section>

      <section
        id="policy-feed-filters"
        class="policy-feed-filters"
        aria-label="Filter bills"
      >
        <label class="policy-feed-filters__field">
          <span>State</span>
          <select id="policy-state-filter" name="state">
            <option value="">All states</option>
          </select>
        </label>
        <label class="policy-feed-filters__check">
          <input id="policy-location-toggle" type="checkbox" />
          <span>Affects my location</span>
        </label>
        <form id="policy-location-form" class="policy-feed-filters__location" hidden>
          <label class="policy-feed-filters__field policy-feed-filters__field--grow">
            <span>Address or ZIP</span>
            <input
              id="policy-location-input"
              type="text"
              name="location"
              autocomplete="street-address"
              placeholder="Street address or ZIP code"
            />
          </label>
          <button class="refresh-btn" type="submit">Apply</button>
        </form>
        <p id="policy-filter-status" class="policy-feed-filters__status" hidden></p>
      </section>

      <div id="policy-feed-panel">
        <section class="policy-feed-summary">
          <div id="policy-feed-coverage" class="policy-feed-coverage"></div>
          <p id="policy-feed-status" class="status" hidden></p>
        </section>

        <section
          id="policy-feed-empty"
          class="policy-feed-empty"
          hidden
          aria-live="polite"
        ></section>

        <section
          id="policy-feed-list"
          class="policy-feed-list"
          aria-live="polite"
        ></section>
      </div>

      <div id="foryou-feed-panel" hidden>
        <p id="foryou-status" class="status" hidden></p>
        <section class="feed-suggestions" aria-label="Suggested items">
          <h2>What you might also care about</h2>
          <p class="subtitle" style="margin-top: 0.25rem; margin-bottom: 1rem">
            Related bills and proposals based on topics and people you follow —
            not already in your feed.
          </p>
          <div id="foryou-list" class="feed-stream"></div>
        </section>
      </div>
    </main>

    <script src="config.js"></script>
    <script src="shared.js"></script>
    <script src="nav.js"></script>
    <script src="bills-policies.js?v=20260729a" defer></script>
  </body>
</html>
