<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bills, Laws & Policies · Congress Bills</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav id="app-nav" class="app-nav" aria-label="Main"></nav>

    <main class="page page--policy-feed">
      <header class="header">
        <div>
          <p class="eyebrow">Legislation</p>
          <h1>Bills, Laws & Policies</h1>
          <p class="subtitle">
            Track what government is proposing, changing, and passing across
            Federal, State, City, and District levels.
          </p>
        </div>
      </header>

      <section class="policy-feed-tabs" aria-label="Bills feeds">
        <button
          id="tab-all-feed"
          class="policy-feed-tabs__button is-active"
          type="button"
          data-tab="all"
        >
          All News Feed
        </button>
        <button
          id="tab-my-feed"
          class="policy-feed-tabs__button"
          type="button"
          data-tab="mine"
        >
          My Feed
        </button>
      </section>

      <section class="policy-feed-summary">
        <div id="policy-feed-coverage" class="policy-feed-coverage"></div>
        <p id="policy-feed-status" class="status" hidden></p>
      </section>

      <section
        id="policy-feed-empty"
        class="policy-feed-empty"
        hidden
        aria-live="polite"
      ></section>

      <section id="policy-feed-list" class="policy-feed-list" aria-live="polite"></section>
    </main>

    <script src="config.js"></script>
    <script src="shared.js"></script>
    <script src="nav.js"></script>
    <script src="bills-policies.js?v=20260728f" defer></script>
  </body>
</html>
