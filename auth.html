<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in · Article 1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=20260808navlocal" />
  </head>
  <body class="page-app page-auth">
    <nav id="app-nav" class="app-nav app-nav--auth" aria-label="Article 1"></nav>

    <main class="auth-stage">
      <section class="auth-panel" aria-labelledby="auth-title">
        <p class="auth-panel__brand">Article 1</p>
        <h1 id="auth-title">Sign in</h1>
        <p id="auth-subtitle" class="auth-panel__lede">
          Use your email or username and password.
        </p>

        <div
          id="auth-mode-tabs"
          class="auth-tabs"
          role="tablist"
          aria-label="Account options"
        >
          <button
            type="button"
            class="auth-tabs__btn is-active"
            role="tab"
            id="auth-tab-signin"
            aria-selected="true"
            data-auth-tab="signin"
          >
            Sign in
          </button>
          <button
            type="button"
            class="auth-tabs__btn"
            role="tab"
            id="auth-tab-signup"
            aria-selected="false"
            data-auth-tab="signup"
          >
            Create account
          </button>
        </div>

        <p id="auth-status" class="status" hidden></p>

        <form id="signin-form" class="auth-form" data-auth-panel="signin">
          <label class="auth-form__label" for="signin-identifier"
            >Email or username</label
          >
          <input
            id="signin-identifier"
            class="auth-form__input"
            type="text"
            required
            autocomplete="username"
            placeholder="you@example.com"
          />
          <div class="auth-form__row">
            <label class="auth-form__label" for="signin-password">Password</label>
            <a class="auth-form__aside" href="auth.html?mode=forgot">Forgot?</a>
          </div>
          <input
            id="signin-password"
            class="auth-form__input"
            type="password"
            required
            autocomplete="current-password"
            placeholder="Your password"
            minlength="6"
          />
          <button class="auth-form__submit" type="submit">Sign in</button>
        </form>

        <form id="signup-form" class="auth-form" data-auth-panel="signup" hidden>
          <label class="auth-form__label" for="signup-username">Username</label>
          <input
            id="signup-username"
            class="auth-form__input"
            type="text"
            required
            autocomplete="username"
            placeholder="choose a username"
            minlength="3"
            maxlength="30"
            pattern="[A-Za-z0-9_]+"
            title="Letters, numbers, and underscores only"
          />
          <label class="auth-form__label" for="signup-email">Email</label>
          <input
            id="signup-email"
            class="auth-form__input"
            type="email"
            required
            autocomplete="email"
            placeholder="you@example.com"
          />
          <label class="auth-form__label" for="signup-password">Password</label>
          <input
            id="signup-password"
            class="auth-form__input"
            type="password"
            required
            autocomplete="new-password"
            placeholder="At least 6 characters"
            minlength="6"
          />
          <button class="auth-form__submit" type="submit">Create account</button>
        </form>

        <section id="check-email-panel" class="auth-form" hidden>
          <p class="auth-form__note" id="check-email-copy">
            Check your inbox for a verification link, then come back to sign in.
          </p>
          <button type="button" class="auth-form__submit" data-auth-tab="signin">
            Back to sign in
          </button>
        </section>

        <form id="forgot-form" class="auth-form" hidden>
          <label class="auth-form__label" for="forgot-identifier"
            >Email or username</label
          >
          <input
            id="forgot-identifier"
            class="auth-form__input"
            type="text"
            required
            autocomplete="username"
            placeholder="you@example.com"
          />
          <button class="auth-form__submit" type="submit">Send reset link</button>
          <p class="auth-form__footer">
            <a href="auth.html">Back to sign in</a>
          </p>
        </form>

        <form id="reset-form" class="auth-form" hidden>
          <label class="auth-form__label" for="reset-password">New password</label>
          <input
            id="reset-password"
            class="auth-form__input"
            type="password"
            required
            autocomplete="new-password"
            placeholder="Choose a new password"
            minlength="6"
          />
          <label class="auth-form__label" for="reset-password-confirm"
            >Confirm password</label
          >
          <input
            id="reset-password-confirm"
            class="auth-form__input"
            type="password"
            required
            autocomplete="new-password"
            placeholder="Type it again"
            minlength="6"
          />
          <button class="auth-form__submit" type="submit">Update password</button>
        </form>

        <form id="otp-request-form" class="auth-form" hidden>
          <label class="auth-form__label" for="otp-identifier"
            >Email or username</label
          >
          <input
            id="otp-identifier"
            class="auth-form__input"
            type="text"
            required
            autocomplete="username"
            placeholder="you@example.com"
          />
          <button class="auth-form__submit" type="submit">Send code</button>
          <p class="auth-form__footer">
            <a href="auth.html">Back to sign in</a>
          </p>
        </form>

        <form id="otp-verify-form" class="auth-form" hidden>
          <p class="auth-form__note" id="otp-sent-to" hidden></p>
          <label class="auth-form__label" for="otp-code">Email code</label>
          <input
            id="otp-code"
            class="auth-form__input"
            type="text"
            inputmode="numeric"
            required
            autocomplete="one-time-code"
            placeholder="6-digit code"
            minlength="6"
            maxlength="12"
          />
          <button class="auth-form__submit" type="submit">Verify &amp; sign in</button>
          <p class="auth-form__footer">
            <button id="otp-resend-btn" class="auth-text-btn" type="button">
              Resend code
            </button>
            <a href="auth.html">Password sign in</a>
          </p>
        </form>
      </section>
    </main>

    <script src="config.js"></script>
    <script src="shared.js?v=20260806guestux"></script>
    <script src="nav.js?v=20260808navlocal"></script>
    <script src="auth.js?v=20260806guestux" defer></script>
  </body>
</html>
