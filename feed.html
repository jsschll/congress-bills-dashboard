<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feed · Congress Bills</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav id="app-nav" class="app-nav" aria-label="Main">
      <div class="app-nav__inner">
        <a class="app-nav__brand" href="index.html">Congress Bills</a>
        <div class="app-nav__links">
          <a class="app-nav__link" href="index.html">Bills</a>
          <a class="app-nav__link is-active" href="feed.html">Feed</a>
          <a class="app-nav__link" href="topics.html">Topics</a>
        </div>
        <div class="app-nav__actions" id="app-nav-actions">
          <a class="app-nav__button app-nav__button--ghost" href="auth.html"
            >Sign in</a
          >
          <a
            class="app-nav__button app-nav__button--primary"
            href="auth.html?mode=signup"
            >Sign up</a
          >
        </div>
      </div>
    </nav>

    <main class="page page--feed">
      <header class="header">
        <div>
          <p class="eyebrow">Updates</p>
          <h1>Your feed</h1>
          <p class="subtitle">
            Newest bill updates for topics you follow, with related suggestions
            below.
          </p>
        </div>
        <a class="refresh-btn" href="topics.html">Manage topics</a>
      </header>

      <p id="feed-status" class="status" hidden></p>
      <section id="feed-stream" class="feed-stream" aria-label="Update feed"></section>
      <section
        id="suggestions"
        class="feed-suggestions"
        aria-label="Suggested bills"
        hidden
      >
        <h2>You might also care about</h2>
        <div id="suggestions-list" class="feed-stream"></div>
      </section>
    </main>

    <script src="config.js"></script>
    <script src="shared.js"></script>
    <script src="nav.js"></script>
    <script src="feed.js" defer></script>
  </body>
</html>
