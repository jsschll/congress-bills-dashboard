name: Publish judge data to Supabase

on:
  push:
    branches: [main]
    paths:
      - "data/**/*.csv"
      - "scripts/import-*.js"
      - "scripts/lib/**"
      - ".github/workflows/import-judges.yml"
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Import CSVs into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/import-all-judges.js
