<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Politicians · Congress Bills</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=20260729g" />
  </head>
  <body>
    <nav id="app-nav" class="app-nav" aria-label="Main"></nav>

    <main class="page">
      <header class="header">
        <div>
          <p class="eyebrow">Representation</p>
          <h1>Politicians</h1>
          <p class="subtitle">
            Look up federal, state, county, city, and school officials for an
            address — then follow the ones you want to track.
          </p>
        </div>
      </header>

      <section class="lookup-panel" aria-labelledby="lookup-heading">
        <h2 id="lookup-heading">Find who represents you</h2>
        <form id="address-form" class="keyword-form">
          <input
            id="address-input"
            class="search-bar__input"
            type="search"
            name="address"
            placeholder="Street address or ZIP code"
            required
          />
          <button class="refresh-btn" type="submit">Look up</button>
        </form>
      </section>

      <section class="topics-panel" aria-labelledby="browse-heading">
        <div class="topics-panel__header">
          <h2 id="browse-heading">Browse politicians</h2>
        </div>

        <div class="filter-bar">
          <label>
            Level
            <select id="filter-level" class="search-bar__input">
              <option value="federal" selected>Federal</option>
              <option value="all">All levels</option>
              <option value="state">State</option>
              <option value="county">County</option>
              <option value="city">City / Municipal</option>
              <option value="school">School Board / District</option>
            </select>
          </label>
          <label>
            Party
            <select id="filter-party" class="search-bar__input">
              <option value="">Any party</option>
              <option value="Democratic">Democratic</option>
              <option value="Republican">Republican</option>
              <option value="Independent">Independent</option>
            </select>
          </label>
          <label>
            State
            <select id="filter-state" class="search-bar__input">
              <option value="">All states</option>
            </select>
          </label>
          <label class="filter-bar__search">
            Search
            <input
              id="filter-search"
              class="search-bar__input"
              type="search"
              placeholder="Name or district"
            />
          </label>
        </div>

        <p id="browse-status" class="status" hidden></p>
        <div id="politicians-grid" class="politician-results"></div>
      </section>
    </main>

    <script src="config.js"></script>
    <script src="shared.js"></script>
    <script src="nav.js?v=20260729g"></script>
    <script src="politicians-shared.js?v=20260729f"></script>
    <script src="politicians.js" defer></script>
  </body>
</html>
