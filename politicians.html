<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Politicians · Article 1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=20260804ps1" />
  </head>
  <body class="page-app page-politicians">
    <nav id="app-nav" class="app-nav" aria-label="Main"></nav>

    <section class="politicians-hero" aria-label="Find your representatives">
      <div class="politicians-hero__media" aria-hidden="true"></div>
      <div class="politicians-hero__shade" aria-hidden="true"></div>
      <div class="politicians-hero__content">
        <p class="politicians-hero__brand">Article 1</p>
        <h1 class="politicians-hero__title">Politicians</h1>
        <p class="politicians-hero__lede">
          Search officials by name, or look up who represents an address —
          then follow the ones you care about.
        </p>
        <form
          id="name-search-form"
          class="politicians-hero__form politicians-hero__form--name"
          aria-label="Search politicians by name"
        >
          <label class="visually-hidden" for="name-search-input"
            >Search by name</label
          >
          <input
            id="name-search-input"
            class="politicians-hero__input"
            type="search"
            name="q"
            placeholder="Search by name — e.g. Josh Hawley"
            autocomplete="off"
            enterkeyhint="search"
          />
          <button class="politicians-hero__submit" type="submit">
            Search names
          </button>
        </form>
        <p class="politicians-hero__or" aria-hidden="true">or</p>
        <form
          id="address-form"
          class="politicians-hero__form"
          aria-label="Look up your representatives"
        >
          <label class="visually-hidden" for="address-input"
            >Street address or ZIP code</label
          >
          <input
            id="address-input"
            class="politicians-hero__input"
            type="search"
            name="address"
            placeholder="Street address or ZIP code"
            autocomplete="street-address"
          />
          <button class="politicians-hero__submit" type="submit">
            Find my representatives
          </button>
        </form>
      </div>
    </section>

    <main class="page page--politicians">
      <section class="politicians-browse" aria-labelledby="browse-heading">
        <div class="politicians-browse__intro">
          <h2 id="browse-heading">Browse politicians</h2>
          <p>
            Results update as you type. Use the name search above, or filter
            by level, party, and state.
          </p>
        </div>

        <div class="filter-bar politicians-filter-bar">
          <label>
            Level
            <select id="filter-level" class="politicians-filter-bar__input">
              <option value="federal" selected>Federal</option>
              <option value="all">All levels</option>
              <option value="state">State</option>
              <option value="county">County</option>
              <option value="city">Municipal</option>
              <option value="school">School Board / District</option>
            </select>
          </label>
          <label>
            Party
            <select id="filter-party" class="politicians-filter-bar__input">
              <option value="">Any party</option>
              <option value="Democratic">Democratic</option>
              <option value="Republican">Republican</option>
              <option value="Independent">Independent</option>
            </select>
          </label>
          <label>
            State
            <select id="filter-state" class="politicians-filter-bar__input">
              <option value="">All states</option>
            </select>
          </label>
          <label class="filter-bar__search">
            Name filter
            <input
              id="filter-search"
              class="politicians-filter-bar__input"
              type="search"
              placeholder="Filter by name or district"
            />
          </label>
          <label class="politicians-filter-bar__following">
            <input id="filter-following" type="checkbox" />
            Followed only
          </label>
        </div>

        <p id="browse-status" class="status politicians-status" hidden></p>
        <div id="politicians-grid" class="politician-results"></div>
      </section>
    </main>

    <script src="config.js"></script>
    <script src="shared.js"></script>
    <script src="nav.js?v=20260804a1"></script>
    <script src="engagement.js?v=20260729t"></script>
    <script src="politicians-shared.js?v=20260804un1"></script>
    <script src="politicians.js?v=20260729ao" defer></script>
  </body>
</html>
